{% extends "base.html" %}
{% block title %}Log in – Citra{% endblock %}
{% block content %}
<section class="login">
  <div>
    <h1 class="display md" style="font-size: clamp(2.8rem, 8vw, 6.6rem);">Every campaign, from first offer to final report.</h1>
    <p class="lede">Brands choose creators and send offers. Creators answer, share shipping details and report results. One place for both.</p>
  </div>
  <div class="stage">
  <form method="post" class="glass panel stack">
    <h2>Log in</h2>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn cobalt" type="submit">Log in</button>
  </form>
  </div>
</section>
{% endblock %}
